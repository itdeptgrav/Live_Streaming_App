name: Build mediasoup worker binary

on:
  workflow_dispatch: {}
  push:
    paths:
      - "signaling-server/package.json"
      - "signaling-server/package-lock.json"
    branches: [main]

jobs:
  build-worker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip build-essential
          pip3 install --break-system-packages meson ninja

      - name: Install signaling-server deps (compiles mediasoup worker)
        working-directory: signaling-server
        run: npm ci

      - name: Locate compiled worker binary
        working-directory: signaling-server
        run: |
          find node_modules/mediasoup -name "mediasoup-worker" -type f
          find node_modules/mediasoup -name "mediasoup-worker" -type f -exec cp {} /tmp/mediasoup-worker \;

      - name: Upload worker binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediasoup-worker-linux-x64
          path: /tmp/mediasoup-worker
          retention-days: 90